# A server's own nginx sites, in place of the generic nginx.conf (microbetag on port 80): copy this file to
# sites.conf (not tracked by git), adapt it, and mount it with docker-compose.override.yml (see
# docker-compose.override.example.yml). Here: microbetag on its domain, over HTTP and HTTPS, with the certificates
# docker-compose.yml mounts (services/nginx/certs, not tracked). Other sites of the server go here too.

upstream microbetag {
    server web:5000;   # the web app (docker-compose.yml)
}

server {
    listen 80;
    server_name microbetag.example.org;

    location / {
        proxy_pass http://microbetag;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
        proxy_read_timeout 1800;
        proxy_connect_timeout 1800;
        proxy_send_timeout 1800;
        send_timeout 1800;
    }
}

server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/certificate.crt;
    ssl_certificate_key /etc/nginx/certs/certificate.key;
    server_name microbetag.example.org;

    location / {
        proxy_pass http://microbetag;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
        proxy_read_timeout 1800;
        proxy_connect_timeout 1800;
        proxy_send_timeout 1800;
        send_timeout 1800;
    }
}
