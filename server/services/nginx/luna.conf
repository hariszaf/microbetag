# The sites of our server (KU Leuven), mounted in place of nginx.conf by its docker-compose.override.yml:
#   microbetag      msysbio.gbiomed.kuleuven.be, HTTP and HTTPS, to the web app (web:5000)
#   mGrowthDB       mgrowthdb.gbiomed.kuleuven.be, HTTP and HTTPS, to its app on the host (port 8081), and its
#                   static files from /data/mgrowthdb
# The certificates are those docker-compose.yml mounts (services/nginx/certs, not tracked).

upstream u0156635 {
    server web:5000;
}

upstream mgrowth {
    # This IP is the standard host IP for docker
    server 172.17.0.1:8081;
}

server {
    listen 80;
    server_name msysbio.gbiomed.kuleuven.be;

    location / {
        # allows Nginx to act as a reverse proxy. 
        # It is used to forward HTTP requests to a specified backend server (usually located on another host or port) 
        # and then relay the response from that server back to the original client, as if Nginx were the actual endpoint server.
        proxy_pass http://u0156635;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;

        proxy_read_timeout 1800;
        proxy_connect_timeout 1800;
        proxy_send_timeout 1800;
        send_timeout 1800;
    }
}

server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/certificate.crt;
    ssl_certificate_key /etc/nginx/certs/certificate.key;

    server_name msysbio.gbiomed.kuleuven.be;

    location / {
        proxy_pass http://u0156635;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;


        proxy_read_timeout 1800;
        proxy_connect_timeout 1800;
        proxy_send_timeout 1800;
        send_timeout 1800;
    }
}

server {
    listen 80;

    server_name mgrowthdb.gbiomed.kuleuven.be;

    location / {
        # allows Nginx to act as a reverse proxy. 
        # It is used to forward HTTP requests to a specified backend server (usually located on another host or port) 
        # and then relay the response from that server back to the original client, as if Nginx were the actual endpoint server.
        proxy_pass http://mgrowth;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;

        proxy_read_timeout 1800;
        proxy_connect_timeout 1800;
        proxy_send_timeout 1800;
        send_timeout 1800;
    }


}

server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/certificate.crt;
    ssl_certificate_key /etc/nginx/certs/certificate.key;

    server_name mgrowthdb.gbiomed.kuleuven.be;

    location / {
        proxy_pass http://mgrowth;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;


        proxy_read_timeout 1800;
        proxy_connect_timeout 1800;
        proxy_send_timeout 1800;
        send_timeout 1800;
    }


    # ADDED ON 2025.11.20
    # Render static files directly, instead of going through python:
    location /static/ {
	    # Wherever the root of your application is:
	    root /data/mgrowthdb/;
    }

    # Show contents of "export" directory where bulk exports are located:
    location /static/export/ {
	    # Wherever the root of your application is:
	    root /data/mgrowthdb/;

	    autoindex on;

	    # Show rounded file sizes:
	    autoindex_exact_size off;
    }

}
