upstream backend {
    # server mgrowthdb:8000;
    # server microbetag.local:8001;
    server web:5000;  # Use the service name from docker-compose.yml

}

server {
    listen 80;
    server_name microbetag.local;

    location / {
        proxy_pass http://backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;

        proxy_read_timeout 1800;
        proxy_connect_timeout 1800;
        proxy_send_timeout 1800;
        send_timeout 1800;
    }
}