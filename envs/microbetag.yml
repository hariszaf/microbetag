# Main microbetag environment: Python package plus the external tools it calls.
#   conda env create -f envs/microbetag.yml
name: microbetag
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.10.*=*_cpython  # avoid conda picking PyPy
  - pip
  # ORF prediction
  - prodigal=2.6.3
  # KEGG ORTHOLOGY annotation (kofam profiles)
  - hmmer=3.4
  # CarveMe genome-scale model reconstruction
  - diamond=2.1.9
  # ORF prediction for ModelSEEDpy reconstructions
  - fraggenescan=1.32
  # FlashWeave network inference; FlashWeave itself is added by install.sh
  - julia=1.9.4
  # clears the executable-stack flag on Julia's libopenlibm, which newer kernels refuse to load
  - patchelf
  - pip:
      - -e "..[genres,flashweave,otf,test]"
      # manta network clustering; a fork that is not on PyPI, so it can't be a pyproject extra
      - git+https://github.com/hariszaf/manta.git@scipy-version
