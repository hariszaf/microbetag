# Abundance table: sequence ids in the first column, samples, and the sequences in the last column
abundance_file: tests/data/prep/seq_ab_tab.tsv
# IDTAXA training set built from the 16S rRNA gene sequences of the GTDB genomes (.RData, with a `trainingSet` object)
gtdb_16s_training_set: data/gtdb_16s.RData
# IDTAXA confidence threshold: 60 (cautious) or 50 (sensible)
idtaxa_threshold: 60
threads: 2
outdir: prep_output
