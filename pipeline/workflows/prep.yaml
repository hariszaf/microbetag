# Prepare an amplicon dataset for the on-the-fly version of microbetag (MGG).
# Run with: nextflow run main.nf -params-file workflows/prep.yaml --workflow prep

# Abundance table: sequence ids (ASVs/OTUs) in the first column, then the samples,
# and the sequences in the last column.
abundance_file: tests/data/prep/seq_ab_tab.tsv

# Output folder: GTDB_tax_assigned_abundance_table.tsv and flashweave/fw_net.txt
outdir: tests/results/prep
threads: 2

# Assign GTDB taxonomies to the sequences with IDTAXA
assign_taxonomy: true
# IDTAXA training set: DECIPHER's LearnTaxa on the 16S rRNA gene sequences of the GTDB r207 genomes
# (GTDB_bac120_arc53_ssu_r207_fullTaxo.fa.gz, https://zenodo.org/records/6655692). Its GTDB release needs
# to match the one of the server's database, since microbetag matches taxa to genomes by their GTDB names.
gtdb_16s_training_set: databases/gtdb_r207_ssu_idtaxa.RData
# IDTAXA confidence threshold: 60 (cautious) or 50 (sensible)
idtaxa_threshold: 60

# Infer the co-occurrence network with FlashWeave
build_network: true
# Metadata file for FlashWeave; leave empty if not available
metadata_file: tests/data/prep/metadata_transpose.tsv

flashweave_args:
  # Enable heterogeneous mode for multi-habitat or -protocol data with at least thousands of samples (FlashWeaveHE).
  heterogeneous: false
  # Enable fine-grained associations (FlashWeave-S, FlashWeaveHE-S); false results in the fast modes FlashWeave-F or FlashWeaveHE-F
  sensitive: true
  # Do not compute associations between variables with fewer reliable samples than this; FlashWeave's default
  # is 20, the example table has 16 samples. -1 lets FlashWeave choose.
  n_obs_min: 16
