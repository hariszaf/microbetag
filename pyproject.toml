[build-system]
requires      = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "microbetag"
dynamic         = ["version"]
description     = "A library for microbial co-occurrence network annotation."
readme          = "README.md"
license         = "GPL-3.0-or-later"
license-files   = ["LICENSE"]
authors         = [{ name = "Haris Zafeiropoulos", email = "haris.zafeiropoulos@kuleuven.be" }]
requires-python = ">=3.10"
classifiers     = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Core dependencies: what `import microbetag` and the microbetag-* commands need.
# Exact pins belong in the container build, not here.
dependencies = [
    "numpy>=1.24,<2",
    "pandas>=2.0",
    "scipy>=1.10",
    "networkx>=3.1",
    "PyYAML>=5.4.1",
    "tqdm>=4.66",
    "colorlog>=6.9",
    "requests",
    "ndex2>=3.10",
    "pyshorteners>=1.0.1",
    "python-libsbml>=5.20",
    "biom-format",
    "cobra>=0.29",
]

[project.optional-dependencies]
# Genome-scale metabolic model reconstruction with CarveMe
genres = ["carveme==1.6.1", "reframed==1.5.0", "gurobipy>=10,<11"]
# Network inference with FlashWeave (also needs a Julia installation)
flashweave = ["julia>=0.6.2"]
# On-the-fly version, querying the microbetag database
otf = ["mysql-connector-python"]
test = ["pytest>=7"]

[project.scripts]
microbetag              = "microbetag.microbetag:main"
# Used by the microbetag-nf Nextflow pipeline
microbetag-annotate     = "microbetag.cli.annotate:main"
microbetag-format-fw    = "microbetag.cli.format_fw:main"
microbetag-format-manta = "microbetag.cli.format_manta:main"
microbetag-pcompl       = "microbetag.cli.pcompl:main"
microbetag-pcompl-ext   = "microbetag.cli.pcompl_ext:main"
microbetag-seed-sets    = "microbetag.cli.seed_sets:main"
microbetag-seed-compls  = "microbetag.cli.seed_compls:main"
microbetag-scompls-pkl  = "microbetag.cli.scompls_pkl:main"
microbetag-ssets-pkl    = "microbetag.cli.ssets_pkl:main"

[project.urls]
Documentation = "https://microbetag.readthedocs.io/"
Source        = "https://github.com/hariszaf/microbetag"

[tool.setuptools.dynamic]
version = { attr = "microbetag.__version__" }

[tool.setuptools.packages.find]
include = ["microbetag", "microbetag.*"]

[tool.setuptools.package-data]
microbetag = ["mtg_maps_models/**/*", "PhyloMint/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
