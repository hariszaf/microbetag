name: CI

on:
  push:
    branches: [develop, main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install microbetag
        run: pip install ".[test]"

      - name: Run tests
        run: pytest -v

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build only, to check that the image still builds and runs
      - name: Build the container image
        run: docker build -t microbetag:ci .

      - name: Run microbetag in the image
        run: |
          docker run --rm -v $PWD/tests/data/microbetag:/data microbetag:ci \
            bash -c "cp -r /data /tmp/run && microbetag --config /tmp/run/config.yml && ls /tmp/run/output/*.cx2"

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import re; print(re.search(r'__version__\s*=\s*\"(.+?)\"', open('microbetag/__init__.py').read()).group(1))")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match microbetag.__version__ ${version}"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    # Runs only for version tags, e.g. v1.1.0
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing, no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
